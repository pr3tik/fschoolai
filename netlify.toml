[build]
  publish = "."
  functions = "netlify/functions"

[functions."ai"]
  timeout = 26

[functions."init"]
  timeout = 10

[functions."proxy"]
  timeout = 20

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML — never cache, always fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Icons — long cache (content-addressed)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manifest — short cache only
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Netlify functions — never cache
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# SPA catch-all — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
